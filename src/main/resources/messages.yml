prefix: "<gold><bold>CubeXSLG</bold></gold><gray> | </gray>"

startup:
  enabled: "<prefix><green>玩法核心已加载。平台: <platform>，数据库: <database></green>"
  disabled: "<prefix><yellow>玩法核心已卸载。</yellow>"
  database:
    connected: "<prefix><gray>数据库连接已建立: <database></gray>"

error:
  player-only: "<prefix><red>这个入口只能由玩家执行。</red>"
  no-permission: "<prefix><red>你没有权限执行这个操作。</red>"
  command-failed: "<prefix><red>命令执行失败: <reason></red>"
  unknown-building: "<prefix><red>未知建筑类型: <building></red>"
  database: "<prefix><red>数据库初始化失败: <reason></red>"

town:
  create:
    exists: "<prefix><red>你已经拥有一个城镇。</red>"
    invalid-name: "<prefix><red>城镇名只能包含英文字母、数字和下划线。</red>"
    overlap: "<prefix><red>当前位置与其他城镇冲突。</red>"
    success: "<prefix><green>城镇 <name> 创建成功。</green>"
  border:
    preview: "<prefix><green>已显示边界预览，半径 <radius>。</green>"
  missing: "<prefix><red>你还没有城镇。</red>"

building:
  locked: "<prefix><red><building> 尚未解锁。</red>"
  outside-town: "<prefix><red><building> 必须放在你的领地内。</red>"
  invalid-terrain: "<prefix><red><building> 位置地形不合法。</red>"
  limit-reached: "<prefix><red>建筑数量已达上限 <limit>。</red>"
  insufficient: "<prefix><red><building> 资源不足。</red>"
  built: "<prefix><green>建筑已成功建造：<building>。</green>"
  no-repair-needed: "<prefix><gray>该建筑当前不需要修复。</gray>"
  repaired: "<prefix><green>建筑已修复：<building>。</green>"
  upgraded: "<prefix><green>建筑已升级：<building>。</green>"
  pending-delete: "<prefix><yellow>删除待确认，请执行 /slg confirm。</yellow>"
  pending-move: "<prefix><yellow>移动待确认，请前往目标位置后执行 /slg confirm。</yellow>"
  deleted: "<prefix><green>建筑已删除。</green>"
  moved: "<prefix><green>建筑已移动。</green>"

resident:
  limit-reached: "<prefix><red>居民已达到上限。</red>"
  insufficient-food: "<prefix><red>粮食不足，无法招募居民。</red>"
  recruited: "<prefix><green>已招募居民：<name>。</green>"

tech:
  already: "<prefix><gray><tech> 已研究。</gray>"
  town-level: "<prefix><red><tech> 需要城府 <level> 级。</red>"
  prerequisite: "<prefix><red>前置科技未满足。</red>"
  insufficient: "<prefix><red><tech> 研究资源不足。</red>"
  researched: "<prefix><green>科技已研究：<tech>。</green>"

resource:
  history:
    line: "<prefix><gray><delta></gray> <white><resource></white> <dark_gray>来自</dark_gray> <gray><source></gray>"
  stats:
    line: "<prefix><gray>资源统计：收入 <income>，消耗 <expense>。</gray>"

command:
  help:
    header: "<prefix><yellow>CubeXSLG 玩法命令。</yellow>"
    line:
      create: "<gray>/slg create <name></gray> <dark_gray>-</dark_gray> <white>创建城镇</white>"
      wand: "<gray>/slg wand <building></gray> <dark_gray>-</dark_gray> <white>获取建筑核心</white>"
      resources: "<gray>/slg resources [stats|history]</gray> <dark_gray>-</dark_gray> <white>查看仓储</white>"
      repair: "<gray>/slg repair</gray> <dark_gray>-</dark_gray> <white>修复瞄准的建筑</white>"
      confirm: "<gray>/slg confirm</gray> <dark_gray>-</dark_gray> <white>确认移动或删除</white>"
      residents: "<gray>/slg residents</gray> <dark_gray>-</dark_gray> <white>查看居民</white>"
      recruit: "<gray>/slg recruit</gray> <dark_gray>-</dark_gray> <white>招募居民</white>"
      border: "<gray>/slg border</gray> <dark_gray>-</dark_gray> <white>显示领地边界</white>"
  wand:
    given: "<prefix><green>已发放 <building> 建筑核心。</green>"
  menu:
    opened: "<prefix><gray>已打开 <menu> 界面。</gray>"

admin:
  town:
    list:
      header: "<prefix><gold>=== 城镇列表 (共 <count> 个) ===</gold>"
      empty: "<prefix><gray>当前没有城镇。</gray>"
      entry: "  <white><name></white> <dark_gray>|</dark_gray> 主人: <owner> <dark_gray>|</dark_gray> 等级: <level> <dark_gray>|</dark_gray> 建筑: <buildings>"
    info:
      header: "<prefix><gold>=== 城镇信息: <name> ===</gold>"
      owner: "  <gray>主人:</gray> <white><owner></white>"
      level: "  <gray>等级:</gray> <white><level></white>"
      location: "  <gray>位置:</gray> <white><world> (<x>, <y>, <z>)</white>"
      radius: "  <gray>半径:</gray> <white><radius></white>"
      buildings: "  <gray>建筑:</gray> <white><count>/<limit></white>"
      residents: "  <gray>居民:</gray> <white><count>/<limit></white>"
      resources_header: "  <gray>资源:</gray>"
      resource: "    <white><resource>:</white> <yellow><amount></yellow>"
    not_found: "<prefix><red>未找到城镇: <name></red>"
    deleted: "<prefix><green>城镇 <name> 已删除。</green>"
    transferred: "<prefix><green>城镇 <name> 已转让给 <owner>。</green>"
    level_set: "<prefix><green>城镇 <name> 等级已设置为 <level>。</green>"
  building:
    list:
      header: "<prefix><gold>=== 建筑列表 (共 <count> 个) ===</gold>"
      empty: "<prefix><gray>当前没有建筑。</gray>"
      entry: "  <gray>[<id>]</gray> <white><name></white> <dark_gray>|</dark_gray> 等级: <level> <dark_gray>|</dark_gray> 生命: <health>"
    not_found: "<prefix><red>未找到建筑: <id></red>"
    deleted: "<prefix><green>建筑 <id> 已删除。</green>"
    level_set: "<prefix><green>建筑 <id> 等级已设置为 <level>。</green>"
    invalid_type: "<prefix><red>无效的建筑类型。</red>"
  resident:
    list:
      header: "<prefix><gold>=== 居民列表 (共 <count> 个) ===</gold>"
      empty: "<prefix><gray>当前没有居民。</gray>"
      entry: "  <gray>[<id>]</gray> <white><name></white> <dark_gray>|</dark_gray> 力:<str> 敏:<agi> 智:<int>"
    not_found: "<prefix><red>未找到居民: <id></red>"
    attr_added: "<prefix><green>居民 <id> 的 <attr> 已设置为 <value>。</green>"
    invalid_attr: "<prefix><red>无效的属性: <attr></red>"
  tech:
    granted: "<prefix><green>已授予 <town> 科技 <tech>。</green>"
    reset: "<prefix><green><name> 的科技树已重置。</green>"
    not_found: "<prefix><red>未找到科技: <key></red>"
  resource:
    added: "<prefix><green>已向 <town> 添加 <amount> <resource>。</green>"
  player:
    not_found: "<prefix><red>未找到玩家: <name></red>"
    no_town: "<prefix><gray><name> 没有城镇。</gray>"
    town_info: "<prefix><gray><name> 的城镇: <town> (等级 <level>)</gray>"
    reset: "<prefix><green><name> 的SLG数据已重置。</green>"
  data:
    reloading: "<prefix><gray>正在重载配置...</gray>"
    reloaded: "<prefix><green>配置已重载。</green>"
  stats:
    header: "<prefix><gold>=== 服务器统计 ===</gold>"
    towns: "  <gray>城镇数量:</gray> <white><count></white>"
    buildings: "  <gray>建筑数量:</gray> <white><count></white>"
    residents: "  <gray>居民数量:</gray> <white><count></white>"
