menus:
  town-hall:
    title: "<white>城府管理"
    glass:
      material: "BLACK_STAINED_GLASS_PANE"
      name: "<dark_gray> "
      lore: [ "<dark_gray> " ]
    body:
      slots: [ 19, 20, 21, 22, 23 ]
      templates:
        - material: "LIGHT_BLUE_STAINED_GLASS_PANE"
          name: "<aqua> "
          lore:
            - "<white><line>"
    buttons:
      - id: "storage"
        slot: 10
        material: "CHEST"
        title: "<yellow>仓  储"
        lore:
          - "<gray>查看资源与历史记录"
          - "<gray>▸ 仓库储量总览"
          - "<gray>▸ 资源变动记录"
      - id: "residents"
        slot: 11
        material: "VILLAGER_SPAWN_EGG"
        title: "<green>居  民"
        lore:
          - "<gray>查看居民与招募"
          - "<gray>▸ 居民属性概览"
          - "<gray>▸ 消耗粮食招募"
      - id: "tech"
        slot: 12
        material: "ENCHANTING_TABLE"
        title: "<light_purple>科  技"
        lore:
          - "<gray>研究科技树"
          - "<gray>▸ 五大分支科技"
          - "<gray>▸ 消耗资源解锁"
      - id: "production"
        slot: 13
        material: "CRAFTING_TABLE"
        title: "<gold>生  产"
        lore:
          - "<gray>生产系统概览"
          - "<gray>▸ 各建筑产出速率"
          - "<gray>▸ 原料消耗统计"
      - id: "combat"
        slot: 14
        material: "DIAMOND_SWORD"
        title: "<red>战  斗"
        lore:
          - "<gray>防御与受损状态"
          - "<gray>▸ 建筑生命值"
          - "<gray>▸ 哨塔与兵营"
      - id: "logistics"
        slot: 15
        material: "POWERED_RAIL"
        title: "<blue>物  流"
        lore:
          - "<gray>铁轨与运输网络"
          - "<gray>▸ 矿车路由管理"
          - "<gray>▸ 自动货物调配"
      - id: "border"
        slot: 16
        material: "NETHER_STAR"
        title: "<aqua>边  界"
        lore:
          - "<gray>显示城镇边界预览"
          - "<gray>▸ 持续 15 秒"
          - "<gray>▸ 绿色=可建造"

  storage:
    title: "<white>仓储总览"
    glass:
      material: "BLACK_STAINED_GLASS_PANE"
      name: "<dark_gray> "
      lore: [ "<dark_gray> " ]
    body:
      slots: [ 10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25 ]
      templates:
        - material: "LIGHT_BLUE_STAINED_GLASS_PANE"
          name: "<aqua> "
          lore:
            - "<white><line>"
    buttons:
      - id: "history"
        slot: 30
        material: "WRITABLE_BOOK"
        title: "<gold>变动历史"
        lore:
          - "<gray>查看最近 100 条"
          - "<gray>资源变动记录"
      - id: "stats"
        slot: 32
        material: "PAPER"
        title: "<light_purple>统计报表"
        lore:
          - "<gray>产量与消耗统计"
          - "<gray>▸ 每小时净产出"
          - "<gray>▸ 增长趋势图表"

  resident:
    title: "<white>居民管理"
