        slot: 22
        material: "EMERALD"
        title: "<green>招募居民"
        lore:
          - "<gray>消耗 <gold>粮食</gold> 招募新居民"
          - "<gray>居民将自动分配属性"
          - "<gray>可在城府分配工作岗位"

  tech:
    title: "<white>科技树"
