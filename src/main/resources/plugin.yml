name: CubeXSLG
version: "${version}"
main: io.github.adlamb.cubex.CubeXSLG
description: CubeX SLG base plugin scaffold
api-version: "1.21.8"
load: POSTWORLD
folia-supported: true
authors: [ AdLamb ]
prefix: CubeXSLG

# 软依赖 - WorldEdit（用于 schematic 建筑加载）
softdepend:
  - WorldEdit

permissions:
  cubexslg.command:
    description: Access to CubeXSLG root commands
    default: op
  cubexslg.command.wand:
    description: Access to CubeXSLG building wand commands
    default: op
